# Configuración de SonarCloud. Antes de usarla:
#   1. Entra a https://sonarcloud.io con tu cuenta de GitHub e importa el repositorio CrediSmart.
#   2. Copia aquí el "project key" y la "organization" que te muestre SonarCloud.
#   3. En GitHub: Settings > Secrets and variables > Actions > New secret: SONAR_TOKEN (el token de SonarCloud).
sonar.projectKey=davidjoelrivas_CrediSmart
sonar.organization=davidjoelrivas

sonar.sources=apps/api/src,apps/web/src,packages/domain/src,packages/contracts/src
sonar.tests=apps/api/src,apps/web/src,packages/domain/src,packages/contracts/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.ts,**/*.test.tsx,**/coverage/**

sonar.javascript.lcov.reportPaths=packages/domain/coverage/lcov.info,packages/contracts/coverage/lcov.info,apps/api/coverage/lcov.info,apps/web/coverage/lcov.info
